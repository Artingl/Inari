name: Inari Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: lordmilko/i686-elf-tools:latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check
      run: |
        i686-elf-gcc --version
        nasm --version

    - name: Build
      run: |
        make build

